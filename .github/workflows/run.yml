name: gta6-bot-run

# Zamanlama: GitHub Actions "schedule" en iyi çaba (best-effort) çalışır; gecikebilir veya atlanabilir.
# Saat başı (:00) yoğunluğundan kaçınmak için */20 yerine eşdeğer aralıklı 7,27,47 kullanılır.
# Kaçırılan çalışmalar sorun değildir: bot, son max_item_age_hours içindeki tüm öğeleri tarar ve
# seen_items ile tekrarı önler; böylece atlanan aralık bir sonraki çalışmada telafi edilir.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch: {}

# Yalnızca schedule ve elle tetikleme: pull_request/fork tetikleyicisi YOK, bu yüzden
# fork kaynaklı güvenilmeyen kod secret'lara erişemez.

permissions:
  contents: write   # yalnızca data/ değişikliklerini commit etmek için

concurrency:
  group: gta6-bot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testler (secret YOK, gerçek ağ çağrısı YOK)
        run: python -m pytest -q

      - name: Botu çalıştır
        id: bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID || secrets.ADMIN_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          # Opsiyonel yedek LLM sağlayıcıları (tanımlı değilse atlanır). Yalnızca ücretsiz modeller.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: python -m bot.main

      - name: Veri değişikliklerini commit et
        if: ${{ always() && steps.bot.outcome != 'skipped' }}
        run: |
          git config user.name "gta6-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git add docs/data/feed.json docs/data/feed.js 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Veri değişikliği yok, commit atlanıyor."
            exit 0
          fi
          git commit -m "data: bot çalışması $(date -u +%Y-%m-%dT%H:%MZ) [site beslemesi dahil]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "Push başarısız oldu" >&2
          exit 1
